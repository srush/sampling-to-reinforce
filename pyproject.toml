[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-puzzles"
version = "0.1.0"
description = "Finite random-variable experiments with eager JAX arrays"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jax>=0.4.30", "matplotlib>=3.8", "ipython>=8", "jupytext>=1.16", "plotly>=6", "markdown-it-py>=3", "Pygments>=2.17"]

[tool.setuptools]
py-modules = ["distribution", "viz", "plotly_viz", "puzzles", "checks", "dist_types", "intro_answers"]

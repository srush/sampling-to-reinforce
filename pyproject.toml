[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-puzzles"
version = "0.1.0"
description = "Exact finite-distribution examples for From Sampling to Reinforce"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "ipython>=8", "jupytext>=1.16", "plotly>=6", "markdown-it-py>=3", "Pygments>=2.17"]

[project.optional-dependencies]
static-plots = ["matplotlib>=3.8"]

[tool.setuptools]
py-modules = ["viz", "plotly_viz", "checks", "dist_types", "intro_answers"]
